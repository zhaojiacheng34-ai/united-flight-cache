name: Refresh United fare cache

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - ".github/refresh-request.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional departure date (YYYY-MM-DD, within 60 days)"
        required: false
        type: string
      hub:
        description: "Optional UA hub (EWR, ORD, IAD, DEN, IAH, LAX, SFO)"
        required: false
        type: string
      max_routes:
        description: "Route searches this run (1–175)"
        required: false
        default: "36"
        type: string

permissions:
  contents: write

concurrency:
  group: united-fare-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper
        run: pip install -r requirements.txt
      - name: Resolve refresh request
        id: request
        env:
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_HUB: ${{ inputs.hub || '' }}
          INPUT_MAX_ROUTES: ${{ inputs.max_routes || '36' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DATE_VALUE=$(jq -r '.date // ""' .github/refresh-request.json)
            HUB_VALUE=$(jq -r '.hub // ""' .github/refresh-request.json)
            MAX_VALUE=$(jq -r '.max_routes // 36' .github/refresh-request.json)
          else
            DATE_VALUE="$INPUT_DATE"
            HUB_VALUE="$INPUT_HUB"
            MAX_VALUE="$INPUT_MAX_ROUTES"
          fi
          echo "date=$DATE_VALUE" >> "$GITHUB_OUTPUT"
          echo "hub=$HUB_VALUE" >> "$GITHUB_OUTPUT"
          echo "max_routes=$MAX_VALUE" >> "$GITHUB_OUTPUT"
      - name: Refresh bounded route batch
        env:
          TARGET_DATE: ${{ steps.request.outputs.date }}
          TARGET_HUB: ${{ steps.request.outputs.hub }}
          MAX_ROUTES: ${{ steps.request.outputs.max_routes }}
        run: python scripts/refresh.py
      - name: Publish cache snapshot
        run: |
          if git diff --quiet -- data; then
            echo "Cache did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json data/state.json
          git commit -m "Refresh United fare cache"
          git push
